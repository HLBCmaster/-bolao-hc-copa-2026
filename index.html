    const fmtDate = (iso) => new Date(iso).toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo", day: "2-digit", month: "2-digit" });

    const isLocked = (iso) => new Date() >= new Date(new Date(iso).getTime() - 10 * 60000);

    function outcome(s) {
      if (!s || !s.includes("-")) return null;
      const [a, b] = s.split("-").map(n => parseInt(n.trim(), 10));
      if (isNaN(a) || isNaN(b)) return null;
      return a > b ? "1" : a < b ? "2" : "x";
    }
    function betPoints(guess, result) {
      if (!guess || !result) return 0;
      if (guess.trim() === result.trim()) return PTS_EXATO;
      const a = outcome(guess), b = outcome(result);
      return a && b && a === b ? PTS_RESULTADO : 0;
    }
    function userTotal(u, matches, official) {
      let t = 0;
      matches.forEach(m => { if (m.result) t += betPoints((u.bets || {})[m.id]?.guess, m.result); });
      if (official) PRED_LABELS.forEach(p => {
        const ans = (official[p.key] || "").trim().toLowerCase();
        const guess = ((u.predictions || {})[p.key] || "").trim().toLowerCase();
        if (ans && guess && ans === guess) t += PRED_PTS[p.key];
      });
      return t;
    }

      const [resultDrafts, setResultDrafts] = useState({});

      const isAdmin = user && user.email === ADMIN_EMAIL;
      const deadlinePassed = new Date() > DEADLINE;
      const daysLeft = Math.max(0, Math.ceil((DEADLINE - new Date()) / 86400000));

      // ---- AUTH ----
      useEffect(() => {
        const init = async () => {
          try {
            // Primeiro processa o resultado do redirect (se vier do Google)
            const result = await auth.getRedirectResult();
            if (result && result.user) {
              // Veio de um redirect — processa o perfil imediatamente
              const u = result.user;
              setUser(u);
              const ref = db.collection("users").doc(u.uid);
              const snap = await ref.get();
              if (!snap.exists) {
                setNeedName(true);
              } else {
                setProfile(snap.data());
                setNeedName(false);
              }
              setAuthLoading(false);
              setLoginInProgress(false);
              return;
            }
          } catch (e) {
            if (e.code !== 'auth/no-auth-event') {
              setMsg("Erro no login: " + e.message);
            }
          }

          // Fluxo normal: escuta mudanças de auth
          const unsub = auth.onAuthStateChanged(async (u) => {
            if (u) {
              setUser(u);
              try {
                const ref = db.collection("users").doc(u.uid);
                const snap = await ref.get();
                if (!snap.exists) {
                  setNeedName(true);
                } else {
                  setProfile(snap.data());
                  setNeedName(false);
                }
              } catch (e) {
                setNeedName(true);
              }
            } else {
              setUser(null);
              setProfile(null);
              setNeedName(false);
            }
            setLoginInProgress(false);
            setAuthLoading(false);
          });
          return unsub;
        };

        const unsubPromise = init();
        return () => { unsubPromise.then(unsub => unsub && unsub()); };
      }, []);

      // ---- DADOS ----
      useEffect(() => {
        if (!user || needName) return;
        const u1 = db.collection("matches").orderBy("kickoff").onSnapshot(s => {
          setMatches(s.docs.map(d => d.data()));
        });
        const u2 = db.collection("users").onSnapshot(s => {
          setAllUsers(s.docs.map(d => d.data()));
        });
        const u3 = db.collection("config").doc("official").onSnapshot(s => {
          setOfficial(s.exists ? s.data() : {});
        });
        return () => { u1(); u2(); u3(); };
      }, [user, needName]);

      const login = async () => {
        try {
          setLoginInProgress(true);
          await auth.signInWithRedirect(provider);
        } catch (e) {
          setLoginInProgress(false);
          setMsg("Erro no login: " + e.message);
        }
      };
      const logout = () => auth.signOut();

      const saveName = async () => {
        if (!nameInput.trim()) return;
        try {
          const data = { uid: user.uid, email: user.email, displayName: nameInput.trim(), bets: {}, predictions: {}, predChanges: {}, predSubmitted: false, createdAt: Date.now() };
          await db.collection("users").doc(user.uid).set(data);
          setProfile(data);
          setNeedName(false);
        } catch (e) {
          setMsg("Erro ao salvar nome: " + e.message);
        }
      };

      const seed = async () => {
        setMsg("Semeando 72 jogos...");
        try {
          const batch = db.batch();
          SEED_MATCHES.forEach(m => batch.set(db.collection("matches").doc(m.id), m));
          await batch.commit();
          setMsg("✅ 72 jogos cadastrados com sucesso!");
        } catch (e) {
          setMsg("Erro ao semear: " + e.message);
        }
      };

      const saveBet = async (m) => {
        const cur = (profile.bets || {})[m.id] || { guess: "", changes: 0 };
        const val = (drafts[m.id] !== undefined ? drafts[m.id] : cur.guess).trim();
        if (!val || val === cur.guess) return;
        try {
          const changes = cur.guess ? cur.changes + 1 : 0;
          const newBets = { ...(profile.bets || {}), [m.id]: { guess: val, changes } };
          await db.collection("users").doc(user.uid).update({ bets: newBets });
          setProfile({ ...profile, bets: newBets });
          setDrafts({ ...drafts, [m.id]: undefined });
        } catch (e) {
          setMsg("Erro ao salvar aposta: " + e.message);
        }
      };

      const saveResult = async (m) => {
        const val = (resultDrafts[m.id] || "").trim();
        try {
          await db.collection("matches").doc(m.id).update({ result: val || null });
          setMsg("✅ Resultado salvo: " + team(m.team1).pt + " x " + team(m.team2).pt);
        } catch (e) {
          setMsg("Erro ao lançar resultado: " + e.message);
        }
      };

      const updatePred = (key, value) => {
        if (deadlinePassed) return;
        if (profile.predSubmitted && (profile.predChanges || {})[key] >= 1) return;
        setProfile({ ...profile, predictions: { ...(profile.predictions || {}), [key]: value } });
      };
      const submitPred = async () => {
        if (deadlinePassed) return;
        try {
          const changes = { ...(profile.predChanges || {}) };
          if (profile.predSubmitted) PRED_LABELS.forEach(p => { changes[p.key] = Math.min(1, (changes[p.key] || 0) + 1); });
          const data = { predictions: profile.predictions || {}, predChanges: changes, predSubmitted: true };
          await db.collection("users").doc(user.uid).update(data);
          setProfile({ ...profile, ...data });
          setMsg("✅ Previsões enviadas!");
        } catch (e) {
          setMsg("Erro ao enviar previsões: " + e.message);
        }
      };
      const saveOfficial = async (key, value) => {
        try {
          const data = { ...(official || {}), [key]: value };
          await db.collection("config").doc("official").set(data, { merge: true });
        } catch (e) {
          setMsg("Erro ao salvar: " + e.message);
        }
      };

      if (authLoading || loginInProgress) return <Center><div className="text-white text-center"><div className="text-5xl animate-bounce">🏆</div><p className="mt-3 font-bold">{loginInProgress ? "Entrando..." : "Carregando..."}</p></div></Center>;

      if (!user) return (

            <Header />
            <button onClick={login} className="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded-lg transition mt-2">Entrar com Google</button>
            <a href="https://wa.me/5519981719881" target="_blank" className="block text-center mt-3 text-green-600 font-semibold text-sm">Dúvidas? WhatsApp (19) 98171-9881</a>
            <p className="text-xs text-gray-400 text-center mt-3">Criado por HCmaster</p>
            {msg && <p className="text-xs text-red-500 text-center mt-2">{msg}</p>}
          </Card>
        </Center>

            <input value={nameInput} onChange={e => setNameInput(e.target.value)} onKeyDown={e => e.key === "Enter" && saveName()} placeholder="ex: João, Mari, Carlão..." className="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-green-500 focus:outline-none" autoFocus />
            <p className="text-xs text-gray-500 mt-1">Este nome aparece no ranking</p>
            <button onClick={saveName} disabled={!nameInput.trim()} className="w-full bg-green-500 hover:bg-green-600 disabled:bg-gray-300 text-white font-bold py-3 rounded-lg transition mt-3">Continuar</button>
            {msg && <p className="text-xs text-red-500 text-center mt-2">{msg}</p>}
          </Card>
        </Center>
      );

      const sorted = [...allUsers].map(u => ({ ...u, pts: userTotal(u, matches, official) })).sort((a, b) => b.pts - a.pts);
      const myPts = userTotal(profile, matches, official);
      const tabs = [["placares","📊 Placares"],["acomp","👀 Acompanhamento"],["pred","🌟 Previsões"],["rank","🏆 Ranking"],["regras","📜 Regras"]];
      if (isAdmin) tabs.push(["admin","⚙️ Admin"]);

      return (
        <div className="min-h-screen bg-gray-50">
          <header className="bg-gradient-to-r from-green-500 to-yellow-400 text-white shadow sticky top-0 z-20">
            <div className="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
              <div className="flex items-center gap-2"><span className="text-2xl">🏆</span><div><h1 className="font-bold leading-tight">Bolão HC Copa 2026</h1><p className="text-xs opacity-90">Criado por HCmaster</p></div></div>
              <div className="flex items-center gap-2">
                <div className="text-right"><p className="text-sm font-semibold">{profile.displayName}</p><p className="text-xs opacity-90">{myPts} pts</p></div>
                <button onClick={logout} className="bg-red-500 hover:bg-red-600 text-xs px-3 py-2 rounded-lg">Sair</button>
              </div>
            </div>
            <div className="max-w-3xl mx-auto px-4 pb-2"><div className="bg-black/20 rounded p-2 text-xs flex justify-between flex-wrap gap-1">
              <span>📍 Fase de Grupos</span><span>🎮 {matches.filter(m=>m.result).length}/{matches.length} jogos</span>
              <span>⏱️ Previsões: {deadlinePassed ? "encerradas" : daysLeft + " dias"}</span>
            </div></div>
          </header>

          <nav className="bg-white border-b sticky top-[92px] z-10 overflow-x-auto">
            <div className="max-w-3xl mx-auto px-2 flex">
              {tabs.map(([id, lbl]) => (
                <button key={id} onClick={() => setTab(id)} className={"px-3 py-3 text-sm font-semibold whitespace-nowrap border-b-4 " + (tab === id ? "border-green-500 text-green-600" : "border-transparent text-gray-500")}>{lbl}</button>
              ))}
            </div>
          </nav>

          <main className="max-w-3xl mx-auto px-4 py-5">
            {msg && <div className="bg-blue-50 border border-blue-200 text-blue-800 text-sm rounded-lg p-3 mb-4 flex justify-between"><span>{msg}</span><button onClick={()=>setMsg("")} className="font-bold">✕</button></div>}

            {matches.length === 0 && !isAdmin && <p className="text-center text-gray-500 py-10">Os jogos ainda não foram cadastrados. Volte em breve! ⚽</p>}

            {/* PLACARES */}
            {tab === "placares" && matches.map(m => {
              const bet = (profile.bets || {})[m.id] || { guess: "", changes: 0 };
              const locked = isLocked(m.kickoff);
              const canEdit = !locked && bet.changes < 1;
              const pts = m.result ? betPoints(bet.guess, m.result) : null;
              return (
                <div key={m.id} className="bg-white rounded-xl shadow-sm mb-3 overflow-hidden border border-gray-100">
                  <div className="bg-gray-50 px-3 py-2 flex justify-between items-center text-xs text-gray-500">
                    <span>Grupo {m.group} · {m.matchday} · {fmtDate(m.kickoff)} {fmtTime(m.kickoff)} (SP)</span>
                    {m.result ? <span className={"font-bold px-2 py-0.5 rounded-full " + (pts > 0 ? "bg-green-100 text-green-700" : "bg-gray-200")}>{pts > 0 ? "+" + pts : "0"} pts</span>
                      : locked ? <span className="font-bold px-2 py-0.5 rounded-full bg-orange-100 text-orange-700">🔒 Fechado</span>
                      : <span className="font-bold px-2 py-0.5 rounded-full bg-yellow-100 text-yellow-700">⏰ Aberto</span>}
                  </div>
                  <div className="p-3">
                    <Row flag={team(m.team1).f} name={team(m.team1).pt} score={m.result ? m.result.split("-")[0] : null} />
                    <Row flag={team(m.team2).f} name={team(m.team2).pt} score={m.result ? m.result.split("-")[1] : null} />
                    <p className="text-xs text-gray-400 mt-1">📍 {m.ground}</p>
                    {m.result ? (
                      <div className="mt-2 text-sm bg-gray-50 rounded p-2 flex justify-between">
                        <span>Sua aposta: <b className={pts > 0 ? "text-green-600" : "text-red-500"}>{bet.guess || "—"}</b></span>
                        <span>{pts === PTS_EXATO ? "🎯 Exato!" : pts === PTS_RESULTADO ? "📌 Resultado" : "❌"}</span>
                      </div>
                    ) : canEdit ? (
                      <div className="mt-2 flex gap-2">
                        <input value={drafts[m.id] !== undefined ? drafts[m.id] : bet.guess} onChange={e => setDrafts({ ...drafts, [m.id]: e.target.value })} placeholder="2-1" className="flex-1 px-3 py-2 text-center text-lg font-bold border-2 border-gray-200 rounded-lg focus:border-green-500 focus:outline-none" />
                        <button onClick={() => saveBet(m)} className="bg-green-500 hover:bg-green-600 text-white font-bold px-4 rounded-lg">{bet.guess ? "Alterar" : "Apostar"}</button>
                      </div>
                    ) : (
                      <div className="mt-2 text-sm bg-orange-50 rounded p-2 flex justify-between"><span>Sua aposta: <b>{bet.guess || "não apostou"}</b></span><span className="text-xs text-orange-600">{bet.changes >= 1 ? "alteração usada" : "fechado"}</span></div>
                    )}
                    {bet.guess && canEdit && <p className="text-xs text-gray-400 mt-1">⚠️ Você ainda pode alterar 1 vez.</p>}

                    {isAdmin && (
                      <div className="mt-2 flex gap-2 bg-purple-50 rounded p-2">
                        <input value={resultDrafts[m.id] !== undefined ? resultDrafts[m.id] : (m.result || "")} onChange={e => setResultDrafts({ ...resultDrafts, [m.id]: e.target.value })} placeholder="resultado 2-1" className="flex-1 px-2 py-1 text-center border rounded" />
                        <button onClick={() => saveResult(m)} className="bg-purple-600 text-white text-sm px-3 rounded">Lançar</button>
                      </div>
                    )}
                  </div>
                </div>
              );
            })}

            {/* ACOMPANHAMENTO */}
            {tab === "acomp" && (
              <div className="space-y-4">
                <div className="grid grid-cols-3 gap-2">
                  <Stat n={myPts} l="Seus Pontos" c="green" />
                  <Stat n={(sorted.findIndex(u => u.uid === user.uid) + 1) + "º"} l="Posição" c="purple" />
                  <Stat n={Object.values(profile.bets || {}).filter(b => b.guess).length} l="Apostas" c="blue" />
                </div>
                <Box title="⏰ Próximos jogos">
                  {matches.filter(m => !m.result && !isLocked(m.kickoff)).slice(0, 6).map(m => {
                    const b = (profile.bets || {})[m.id];
                    return <div key={m.id} className="flex justify-between items-center border-l-4 border-yellow-400 bg-yellow-50 rounded-r px-3 py-2 mb-2 text-sm">
                      <span>{team(m.team1).f} {team(m.team1).pt} x {team(m.team2).pt} {team(m.team2).f}<br/><span className="text-xs text-gray-500">{fmtDate(m.kickoff)} {fmtTime(m.kickoff)}</span></span>
                      <span className={"text-xs font-bold px-2 py-1 rounded " + (b?.guess ? "bg-green-100 text-green-700" : "bg-gray-200 text-gray-500")}>{b?.guess || "sem aposta"}</span>
                    </div>;
                  })}
                </Box>
                <Box title="✅ Resultados recentes">
                  {matches.filter(m => m.result).slice(-6).reverse().map(m => {
                    const b = (profile.bets || {})[m.id] || {};
                    const p = betPoints(b.guess, m.result);
                    return <div key={m.id} className={"flex justify-between items-center border-l-4 rounded-r px-3 py-2 mb-2 text-sm " + (p > 0 ? "border-green-500 bg-green-50" : "border-red-400 bg-red-50")}>
                      <span>{team(m.team1).f} {team(m.team1).pt} <b>{m.result}</b> {team(m.team2).pt} {team(m.team2).f}<br/><span className="text-xs text-gray-500">sua aposta: {b.guess || "—"}</span></span>
                      <span className={"font-bold " + (p > 0 ? "text-green-600" : "text-red-500")}>{p > 0 ? "+" + p : "0"}</span>
                    </div>;
                  })}
                </Box>
              </div>
            )}

            {/* PREVISÕES */}
            {tab === "pred" && (
              <div>
                <div className="flex justify-between items-center mb-3">
                  <h2 className="text-xl font-bold">🌟 Previsões Finais</h2>
                  {deadlinePassed ? <span className="bg-gray-200 text-gray-600 text-sm font-bold px-3 py-2 rounded-lg">🔒 Encerradas</span>
                    : <button onClick={submitPred} className="bg-green-500 hover:bg-green-600 text-white text-sm font-bold px-4 py-2 rounded-lg">📤 {profile.predSubmitted ? "Atualizar" : "Enviar"}</button>}
                </div>
                <div className={"text-xs rounded-lg p-3 mb-3 " + (profile.predSubmitted ? "bg-green-50 text-green-800" : "bg-yellow-50 text-yellow-800")}>
                  Apostar/alterar até <b>20/06/2026 23h59 (SP)</b> · {deadlinePassed ? "prazo encerrado" : "faltam " + daysLeft + " dias"} · cada campo pode ser alterado 1 vez após enviar.
                </div>
                {PRED_LABELS.map(p => {
                  const used = profile.predSubmitted && (profile.predChanges || {})[p.key] >= 1;
                  return <div key={p.key} className="bg-white rounded-xl shadow-sm p-3 mb-2">
                    <div className="flex justify-between"><span className="font-bold">{p.label}</span><span className="text-xs text-green-600 font-semibold">+{PRED_PTS[p.key]} pts</span></div>
                    <input value={(profile.predictions || {})[p.key] || ""} onChange={e => updatePred(p.key, e.target.value)} disabled={used || deadlinePassed} placeholder="Digite..." className={"w-full mt-2 px-3 py-2 border-2 rounded-lg font-semibold focus:outline-none " + (used || deadlinePassed ? "bg-gray-100 border-gray-100 text-gray-500" : "border-gray-200 focus:border-green-500")} />
                    {used && <p className="text-xs text-red-500 mt-1">🔒 Alteração já utilizada</p>}
                  </div>;
                })}
              </div>
            )}

            {/* RANKING */}
            {tab === "rank" && (
              <div>
                <h2 className="text-xl font-bold mb-3">🏆 Ranking Geral</h2>
                {sorted.map((u, i) => (
                  <div key={u.uid} className={"flex justify-between items-center rounded-xl shadow-sm p-3 mb-2 " + (u.uid === user.uid ? "bg-green-50 border-2 border-green-500" : "bg-white")}>
                    <div className="flex items-center gap-3">
                      <div className={"w-9 h-9 rounded-full flex items-center justify-center font-bold text-white " + (i===0?"bg-yellow-500":i===1?"bg-gray-400":i===2?"bg-orange-500":"bg-gray-300")}>{i+1}</div>
                      <span className="font-bold">{u.displayName}{u.uid === user.uid && <span className="text-xs text-green-600 ml-1">(você)</span>}</span>
                    </div>
                    <span className="text-xl font-bold text-green-600">{u.pts}</span>
                  </div>
                ))}
              </div>
            )}

            {/* REGRAS */}
            {tab === "regras" && (
              <div className="space-y-3 text-sm">
                <Box title="ℹ️ Geral"><ul className="space-y-1 text-gray-600"><li>🏆 Copa do Mundo 2026 — bolão individual</li><li>👥 Até 50 participantes · sem prêmios</li><li>🕐 Pode entrar durante a Copa (começa com 0 pts)</li></ul></Box>
                <Box title="📊 Placares"><ul className="space-y-1 text-gray-600"><li>✅ Aposta até 10 min antes de cada jogo (horário de SP)</li><li>🔄 Alteração: 1 vez por jogo</li><li>🎯 Placar exato +15 · 📌 Resultado +10</li></ul></Box>
                <Box title="🌟 Previsões"><ul className="space-y-1 text-gray-600"><li>📅 Até 20/06/2026 23h59 (SP)</li><li>🔄 1 alteração por campo após enviar</li><li>Campeão +50 · Vice +30 · 3º +20 · Artilheiro +25 · Melhor +40</li></ul></Box>
                <Box title="💬 Dúvidas?"><a href="https://wa.me/5519981719881" target="_blank" className="inline-block bg-green-500 text-white font-bold py-2 px-5 rounded-lg">WhatsApp (19) 98171-9881</a><p className="text-xs text-gray-500 mt-2">Criado por HCmaster</p></Box>
              </div>
            )}

            {/* ADMIN */}
            {tab === "admin" && isAdmin && (
              <div className="space-y-4">
                <Box title="⚙️ Cadastro dos jogos">
                  <p className="text-sm text-gray-600 mb-2">Jogos no banco: <b>{matches.length}</b>. Clique abaixo para cadastrar os 72 jogos (faça só uma vez).</p>
                  <button onClick={seed} className="bg-purple-600 text-white font-bold px-4 py-2 rounded-lg">Semear 72 jogos</button>
                </Box>
                <Box title="🏅 Resultados finais (para pontuar as previsões)">
                  <p className="text-xs text-gray-500 mb-2">Preencha ao fim da Copa. Use exatamente o mesmo nome que os jogadores digitaram.</p>
                  {PRED_LABELS.map(p => (
                    <div key={p.key} className="flex items-center gap-2 mb-2">
                      <span className="w-32 text-sm">{p.label}</span>
                      <input defaultValue={(official || {})[p.key] || ""} onBlur={e => saveOfficial(p.key, e.target.value)} placeholder="resposta oficial" className="flex-1 px-2 py-1 border rounded text-sm" />
                    </div>
                  ))}
                  <p className="text-xs text-gray-400">Salva automaticamente ao clicar fora do campo.</p>
                </Box>
                <p className="text-xs text-gray-500">💡 Para lançar placares dos jogos, vá na aba <b>Placares</b> — só você vê o campo roxo "Lançar".</p>
              </div>
            )}
          </main>
          <footer className="text-center text-xs text-gray-400 py-5">⚽ Bolão HC Copa 2026 · HCmaster · <a href="https://wa.me/5519981719881" className="text-green-600">WhatsApp</a></footer>
        </div>
      );
    }

    const Center = ({ children }) => <div className="min-h-screen bg-gradient-to-br from-green-500 via-yellow-400 to-green-600 flex items-center justify-center p-4">{children}</div>;
    const Card = ({ children }) => <div className="bg-white rounded-2xl shadow-2xl p-7 max-w-sm w-full">{children}</div>;
    const Header = () => <div className="text-center mb-3"><div className="text-5xl">🏆</div><h1 className="text-2xl font-bold text-gray-800 mt-2">Bolão HC Copa 2026</h1><p className="text-gray-500 text-sm">Faça suas previsões e compete!</p></div>;
    const Row = ({ flag, name, score }) => <div className="flex items-center gap-3 py-1"><div className={"w-11 h-11 rounded-lg flex items-center justify-center text-xl font-bold " + (score !== null ? "bg-green-100 text-green-700" : "bg-gray-100 text-gray-400")}>{score !== null ? score : "–"}</div><span className="text-xl">{flag}</span><span className="font-bold text-gray-800">{name}</span></div>;
    const Stat = ({ n, l, c }) => <div className="bg-white rounded-lg shadow-sm p-3 text-center"><p className={"text-2xl font-bold text-" + c + "-600"}>{n}</p><p className="text-xs text-gray-500">{l}</p></div>;
    const Box = ({ title, children }) => <div className="bg-white rounded-xl shadow-sm p-4"><h3 className="font-bold text-gray-800 mb-2">{title}</h3>{children}</div>;

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>

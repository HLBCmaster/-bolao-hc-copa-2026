  const isLocked = iso => new Date() >= new Date(new Date(iso).getTime()-10*60000);

  function outcome(s) {
    if (!s||!s.includes("-")) return null;
    const [a,b]=s.split("-").map(n=>parseInt(n.trim(),10));
    if (isNaN(a)||isNaN(b)) return null;
    return a>b?"1":a<b?"2":"x";
  }
  function betPoints(guess,result) {
    if (!guess||!result) return 0;
    if (guess.trim()===result.trim()) return PTS_EXATO;
    const a=outcome(guess),b=outcome(result);
    return a&&b&&a===b?PTS_RESULTADO:0;
  }
  function userTotal(u,matches,official) {
    let t=0;
    matches.forEach(m=>{ if(m.result) t+=betPoints((u.bets||{})[m.id]?.guess,m.result); });
    if (official) PRED_LABELS.forEach(p=>{
      const ans=(official[p.key]||"").trim().toLowerCase();
      const g=((u.predictions||{})[p.key]||"").trim().toLowerCase();
      if (ans&&g&&ans===g) t+=PRED_PTS[p.key];
    });
    return t;
  }
  function calcStandings(gMatches) {
    const table={};
    gMatches.forEach(m=>{
      [m.team1,m.team2].forEach(t=>{ if(!table[t]) table[t]={name:t,pts:0,j:0,v:0,e:0,d:0,gp:0,gc:0,sg:0}; });
      if (!m.result) return;
      const [g1,g2]=m.result.split("-").map(Number);
      const t1=table[m.team1],t2=table[m.team2];
      t1.j++;t2.j++;t1.gp+=g1;t1.gc+=g2;t1.sg+=g1-g2;t2.gp+=g2;t2.gc+=g1;t2.sg+=g2-g1;
      if(g1>g2){t1.v++;t1.pts+=3;t2.d++;}
      else if(g1<g2){t2.v++;t2.pts+=3;t1.d++;}
      else{t1.e++;t1.pts++;t2.e++;t2.pts++;}
    });
    return Object.values(table).sort((a,b)=>b.pts-a.pts||b.sg-a.sg||b.gp-a.gp);
  }

  // ====================== BetRow — layout HORIZONTAL (time [gol] × [gol] time) ======================
  function BetRow({ m, bet, canEdit, onSave }) {
    const [g1,setG1] = useState(bet.guess ? bet.guess.split("-")[0] : "");
    const [g2,setG2] = useState(bet.guess ? bet.guess.split("-")[1] : "");

    const ScoreBox = ({ value, onChange, locked }) => (
      locked
        ? <div className="w-10 h-10 rounded-xl bg-orange-50 border-2 border-orange-100 flex items-center justify-center font-bold text-lg text-orange-400">{value||"–"}</div>
        : <div className="w-10 h-10 rounded-xl border-2 border-gray-200 focus-within:border-emerald-400 flex items-center justify-center">
            <input type="number" min="0" max="20" value={value} onChange={e=>onChange(e.target.value)} className="w-full h-full text-center font-bold text-lg bg-transparent focus:outline-none" />
          </div>
    );

    return (
      <div>
        {/* ── LINHA ÚNICA: Nome [gol] × [gol] Nome ── */}
        <div className="flex items-center gap-2">
          {/* time 1 */}
          <div className="flex items-center gap-2 flex-1 justify-end">
            <span className="font-semibold text-gray-800 text-sm text-right leading-tight">{tname(m.team1)}</span>
            <Flag name={m.team1} />
          </div>

          {/* placar */}
          <div className="flex items-center gap-1 shrink-0">
            <ScoreBox value={g1} onChange={setG1} locked={!canEdit} />
            <span className="text-gray-400 font-bold text-sm px-0.5">×</span>
            <ScoreBox value={g2} onChange={setG2} locked={!canEdit} />
          </div>

          {/* time 2 */}
          <div className="flex items-center gap-2 flex-1 justify-start">
            <Flag name={m.team2} />
            <span className="font-semibold text-gray-800 text-sm leading-tight">{tname(m.team2)}</span>
          </div>
        </div>

        {canEdit && (
          <button onClick={()=>{ if(g1!==""&&g2!=="") onSave(g1,g2); }} disabled={g1===""||g2===""}
            className={`w-full mt-3 py-2 rounded-xl font-semibold text-sm transition disabled:bg-gray-200 disabled:text-gray-400 text-white ${bet.guess ? "bg-red-500 hover:bg-red-600" : "bg-emerald-500 hover:bg-emerald-600"}`}>
            {bet.guess ? "Alterar aposta" : "Enviar aposta"}
          </button>
        )}

    );
  }

  function App() {
    const [user,setUser]=useState(null);
    const [profile,setProfile]=useState(null);
    const [authLoading,setAuthLoading]=useState(true);
    const [loginInProgress,setLoginInProgress]=useState(false);
    const [needName,setNeedName]=useState(false);
    const [nameInput,setNameInput]=useState("");
    const [matches,setMatches]=useState([]);
    const [allUsers,setAllUsers]=useState([]);
    const [official,setOfficial]=useState(null);
    const [tab,setTab]=useState("placares");
    const [resultDrafts,setResultDrafts]=useState({});
    const [msg,setMsg]=useState("");
    const [editingTeam,setEditingTeam]=useState(null);
    const [groupRounds,setGroupRounds]=useState({});

    const isAdmin=user&&user.email===ADMIN_EMAIL;
    const deadlinePassed=new Date()>DEADLINE;
    const daysLeft=Math.max(0,Math.ceil((DEADLINE-new Date())/86400000));

    useEffect(()=>{
      const unsub=auth.onAuthStateChanged(async u=>{
        if(u){
          setUser(u);
          try{
            const snap=await db.collection("users").doc(u.uid).get();
            if(!snap.exists){setNeedName(true);}
            else{setProfile(snap.data());setNeedName(false);}
          }catch(e){setNeedName(true);}
        }else{setUser(null);setProfile(null);setNeedName(false);}
        setLoginInProgress(false);setAuthLoading(false);
      });
      return unsub;
    },[]);

    useEffect(()=>{
      if(!user||needName) return;
      const u1=db.collection("matches").orderBy("kickoff").onSnapshot(s=>setMatches(s.docs.map(d=>d.data())));
      const u2=db.collection("users").onSnapshot(s=>setAllUsers(s.docs.map(d=>d.data())));
      const u3=db.collection("config").doc("official").onSnapshot(s=>setOfficial(s.exists?s.data():{}));
      return ()=>{u1();u2();u3();};
    },[user,needName]);

    const login=async()=>{
      try{setLoginInProgress(true);await auth.signInWithPopup(provider);}
      catch(e){setLoginInProgress(false);setMsg("Erro no login: "+e.message);}
    };
    const logout=()=>auth.signOut();

    const saveName=async()=>{
      if(!nameInput.trim()) return;
      try{
        const data={uid:user.uid,email:user.email,displayName:nameInput.trim(),bets:{},predictions:{},predChanges:{},predSubmitted:false,createdAt:Date.now()};
        await db.collection("users").doc(user.uid).set(data);
        setProfile(data);setNeedName(false);
      }catch(e){setMsg("Erro: "+e.message);}
    };

    const seed=async()=>{
      setMsg("Semeando 72 jogos...");
      try{
        const batch=db.batch();
        SEED_MATCHES.forEach(m=>batch.set(db.collection("matches").doc(m.id),m));
        await batch.commit();setMsg("✅ 72 jogos cadastrados!");
      }catch(e){setMsg("Erro: "+e.message);}
    };

    const saveBet=async(m,g1str,g2str)=>{
      const g1=parseInt(g1str,10),g2=parseInt(g2str,10);
      if(isNaN(g1)||isNaN(g2)) return;
      const val=`${g1}-${g2}`;
      const cur=(profile.bets||{})[m.id]||{guess:"",changes:0};
      if(val===cur.guess) return;
      try{
        const changes=cur.guess?cur.changes+1:0;
        const newBets={...(profile.bets||{}),[m.id]:{guess:val,changes}};
        await db.collection("users").doc(user.uid).update({bets:newBets});
        setProfile({...profile,bets:newBets});
        setMsg("✅ Aposta salva!");
      }catch(e){setMsg("Erro: "+e.message);}
    };

    const saveResult=async(m)=>{
      const val=(resultDrafts[m.id]||"").trim();
      try{
        await db.collection("matches").doc(m.id).update({result:val||null});
        setMsg("✅ Resultado salvo!");
      }catch(e){setMsg("Erro: "+e.message);}
    };

    const saveTeamName=async(matchId,field,newName)=>{
      if(!newName.trim()) return;
      try{
        await db.collection("matches").doc(matchId).update({[field]:newName.trim()});
        setEditingTeam(null);setMsg("✅ Nome atualizado!");
      }catch(e){setMsg("Erro: "+e.message);}
    };

    const updatePred=(key,value)=>{
      if(deadlinePassed) return;
      if(profile.predSubmitted&&(profile.predChanges||{})[key]>=1) return;
      setProfile({...profile,predictions:{...(profile.predictions||{}),[key]:value}});
    };
    const submitPred=async()=>{
      if(deadlinePassed) return;
      try{
        const changes={...(profile.predChanges||{})};
        if(profile.predSubmitted) PRED_LABELS.forEach(p=>{changes[p.key]=Math.min(1,(changes[p.key]||0)+1);});
        const data={predictions:profile.predictions||{},predChanges:changes,predSubmitted:true};
        await db.collection("users").doc(user.uid).update(data);
        setProfile({...profile,...data});setMsg("✅ Previsões enviadas!");

    };

          </button>

          <p className="text-xs text-gray-400 text-center mt-3">Criado por HCmaster</p>
          {msg&&<p className="text-xs text-red-500 text-center mt-2">{msg}</p>}

            <div className="w-16 h-16 bg-yellow-400 rounded-2xl flex items-center justify-center mx-auto mb-3">

    const myRank=sorted.findIndex(u=>u.uid===user.uid)+1;
    const groups=[...new Set(matches.map(m=>m.group))].sort();
    const tabs=[["placares","Placares"],["grupos","Grupos"],["acomp","Acomp."],["pred","Previsões"],["rank","Ranking"],["regras","Regras"]];

                    </div>
                  )}
                </div>
              </div>

                              <th className="px-3 py-2 text-left font-medium">Time</th>
                              <th className="px-2 py-2 text-center font-medium">J</th>
                              <th className="px-2 py-2 text-center font-medium">V</th>
                              <th className="px-2 py-2 text-center font-medium">E</th>
                              <th className="px-2 py-2 text-center font-medium">D</th>
                              <th className="px-2 py-2 text-center font-medium">SG</th>
                              <th className="px-2 py-2 text-center font-bold text-emerald-600">P</th>
                            </tr>
                          </thead>
                          <tbody>
                            {standings.map((s,i)=>(
                              <tr key={s.name} className={"border-t border-gray-50 "+(i<2?"bg-emerald-50/60":"")}>

                                  <span className={"w-5 h-5 rounded-full text-xs font-bold flex items-center justify-center "+(i<2?"bg-emerald-500 text-white":"bg-gray-200 text-gray-500")}>{i+1}</span>

                                  <div className="flex items-center gap-2">

                          </tbody>
                        </table>

                      <div className="hidden md:block w-px bg-gray-100 my-2"></div>
                      <div className="md:hidden h-px bg-gray-100 mx-4"></div>

                        {/* nav rodada */}

                        {roundMatches.length===0 && (

                                    ? <span className="font-bold text-sm text-emerald-600 w-5 text-right">{m.result.split("-")[1]}</span>

                    <div key={p.key} className="bg-white rounded-2xl shadow-sm p-4 border border-gray-100">
                      <div className="flex justify-between items-center mb-2">
                        <span className="font-semibold text-gray-800">{p.label}</span>
                        <span className="text-xs bg-emerald-100 text-emerald-600 font-bold px-2 py-1 rounded-lg">+{PRED_PTS[p.key]} pts</span>
                      </div>
                      <input value={(profile.predictions||{})[p.key]||""} onChange={e=>updatePred(p.key,e.target.value)} disabled={used||deadlinePassed} placeholder="Digite o nome..." className={"w-full px-3 py-2 border-2 rounded-xl text-sm font-medium focus:outline-none "+(used||deadlinePassed?"bg-gray-50 border-gray-100 text-gray-400 cursor-not-allowed":"border-gray-200 focus:border-emerald-400")} />
                      {used&&<p className="text-xs text-red-400 mt-1">🔒 Alteração já utilizada</p>}
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* ===== RANKING ===== */}
          {tab==="rank"&&(
            <div>
              <h2 className="text-lg font-bold text-gray-900 mb-4">🏆 Ranking Geral</h2>
              <div className="space-y-2">
                {sorted.map((u,i)=>(
                  <div key={u.uid} className={"flex items-center justify-between rounded-2xl p-3 shadow-sm border "+(u.uid===user.uid?"bg-emerald-50 border-emerald-200":"bg-white border-gray-100")}>
                    <div className="flex items-center gap-3">
                      <div className={"w-8 h-8 rounded-xl flex items-center justify-center text-sm font-bold "+(i===0?"bg-yellow-400 text-white":i===1?"bg-gray-300 text-gray-700":i===2?"bg-orange-400 text-white":"bg-gray-100 text-gray-500")}>{i+1}</div>
                      <span className="font-semibold text-gray-800 text-sm">{u.displayName}{u.uid===user.uid&&<span className="text-xs text-emerald-500 ml-1">(você)</span>}</span>
                    </div>
                    <span className="font-bold text-emerald-600 text-sm">{u.pts} pts</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* ===== REGRAS ===== */}
          {tab==="regras"&&(
            <div className="space-y-3">
              {[
                {t:"ℹ️ Geral",items:["🏆 Copa do Mundo 2026 — bolão individual","👥 Até 50 participantes · sem prêmios","🕐 Pode entrar durante a Copa (começa com 0 pts)"]},
                {t:"📊 Placares",items:["✅ Aposta até 10 min antes de cada jogo (horário SP)","🔄 Alteração: 1 vez por jogo","🎯 Placar exato +15 pts · 📌 Resultado certo +10 pts"]},
                {t:"🌟 Previsões",items:["📅 Até 20/06/2026 às 23h59 (SP)","🔄 1 alteração por campo após enviar","Campeão +50 · Vice +30 · 3º +20 · Artilheiro +25 · Melhor +40"]},
              ].map(s=>(
                <div key={s.t} className="bg-white rounded-2xl shadow-sm p-4 border border-gray-100">
                  <h3 className="font-bold text-gray-800 mb-2 text-sm">{s.t}</h3>
                  <ul className="space-y-1">{s.items.map((it,i)=><li key={i} className="text-xs text-gray-600">{it}</li>)}</ul>
                </div>
              ))}
              <div className="bg-white rounded-2xl shadow-sm p-4 border border-gray-100">
                <h3 className="font-bold text-gray-800 mb-3 text-sm">💬 Dúvidas?</h3>
                <a href="https://wa.me/5519981719881" target="_blank" className="flex items-center gap-2 bg-green-500 hover:bg-green-600 text-white font-bold py-2.5 px-4 rounded-xl transition text-sm w-fit">
                  <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                  (19) 98171-9881
                </a>
                <p className="text-xs text-gray-400 mt-3">Criado por HCmaster</p>
              </div>
            </div>
          )}

          {/* ===== ADMIN ===== */}
          {tab==="admin"&&isAdmin&&(
            <div className="space-y-4">
              <div className="bg-white rounded-2xl shadow-sm p-4 border border-gray-100">
                <h3 className="font-bold text-gray-800 mb-2">⚙️ Cadastro dos jogos</h3>
                <p className="text-sm text-gray-500 mb-3">Jogos no banco: <b>{matches.length}</b>. Clique para cadastrar os 72 jogos (faça só uma vez).</p>
                <button onClick={seed} className="bg-purple-600 hover:bg-purple-700 text-white font-bold px-4 py-2.5 rounded-xl transition">Semear 72 jogos</button>
              </div>
              <div className="bg-white rounded-2xl shadow-sm p-4 border border-gray-100">
                <h3 className="font-bold text-gray-800 mb-1">✏️ Renomear times de repescagem</h3>
                <p className="text-xs text-gray-500">Vá na aba <b>Grupos</b> e clique no ✏️ ao lado do time.</p>
              </div>
              <div className="bg-white rounded-2xl shadow-sm p-4 border border-gray-100">
                <h3 className="font-bold text-gray-800 mb-2">🏅 Resultados finais (previsões)</h3>
                <p className="text-xs text-gray-500 mb-3">Preencha ao fim da Copa. Salva ao clicar fora.</p>
                {PRED_LABELS.map(p=>(
                  <div key={p.key} className="flex items-center gap-2 mb-2">
                    <span className="text-xs text-gray-600 w-36">{p.label}</span>
                    <input defaultValue={(official||{})[p.key]||""} onBlur={e=>saveOfficial(p.key,e.target.value)} placeholder="resposta oficial" className="flex-1 px-2 py-1.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-emerald-400" />
                  </div>
                ))}
              </div>
              <p className="text-xs text-gray-400">💡 Para lançar placares use o campo roxo na aba <b>Placares</b>.</p>
            </div>
          )}
        </main>

        <footer className="text-center text-xs text-gray-400 py-6 border-t border-gray-100 mt-4">
          ⚽ Bolão HC Copa 2026 · HCmaster · <a href="https://wa.me/5519981719881" className="text-emerald-500 hover:underline">WhatsApp</a>
        </footer>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
